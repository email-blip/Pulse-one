name: iOS CI

# Builds, tests and captures simulator screenshots on GitHub-hosted Macs.
# Screenshots are pushed to branch ci-screenshots/<branch> so cloud Claude sessions can review them with git.
#
# Speed (DECISIONS.md 2026-11-21): one long job (~55 min) became parallel shards that each build for
# themselves (~2 min) and run one part of the suite on their own simulator, so a run takes about as long
# as its slowest shard (~15-20 min). Nothing is skipped: every push still runs every test, every
# accessibility audit and the full screenshot matrix on all three devices.
# Free plan: at most 5 macOS jobs run at once per account, so a run uses exactly 5 macOS shards.

on:
  push:
    branches-ignore: ["ci-screenshots/**"]
    paths: ["apps/**", "scripts/**", ".github/workflows/ios-ci.yml"]
  # No pull_request trigger: the push run on the PR branch already reports on the PR; running both would double macOS minutes.
  workflow_dispatch:
    inputs:
      app:
        description: "App folder under apps/"
        default: "PulseOne"

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true   # saves macOS minutes

permissions:
  contents: read

env:
  APP: ${{ inputs.app || 'PulseOne' }}
  XCODE_VERSION: "26.6"      # newest on GitHub macos-26 image (2026-11-20); Xcode 27 not offered yet
  XCODEGEN_VERSION: "2.48.0" # pinned

jobs:
  # Cheap Linux job first: a failing guard stops the run before any macOS minute is spent.
  guards:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Schema guard (SwiftData changes must stay lightweight)
        run: python3 scripts/schema-guard.py --app "$APP"

      - name: Term guard (one word for the personal band in all texts)
        run: python3 scripts/term-guard.py --app "$APP"

      - name: ROOK text guard (no routine sentences about missing data, baselines or disclaimers)
        run: python3 scripts/rook-text-guard.py --app "$APP"

  test:
    name: test (${{ matrix.shard }})
    needs: guards
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false   # one red shard must not cancel the others' results and screenshots
      matrix:
        include:
          # Core package tests (Swift Testing), integration tests and all functional UI tests.
          - shard: logic-and-ui
            device: main
            packages: true
            tests: >-
              -only-testing:PulseOneIntegrationTests -only-testing:PulseOneUITests
              -skip-testing:PulseOneUITests/ScreenshotTests -skip-testing:PulseOneUITests/AccessibilityTests
              -skip-testing:PulseOneUITests/ExplorerTests
          # Apple's accessibility audit on every screen (contrast, hit regions, Dynamic Type, labels).
          # The audits inside ActivationTests/CompanionTests run in logic-and-ui.
          # Plus the automatic walkthrough (ExplorerTests, DECISIONS.md 2026-11-22): taps every reachable button,
          # fails on crashes, broken texts and audit findings on the screens it opens, writes explore-report.md.
          # It shares this shard because the audits finish ~10 min before the screenshot shards (5-Mac limit).
          - shard: accessibility
            device: main
            screenshots: true
            tests: -only-testing:PulseOneUITests/AccessibilityTests -only-testing:PulseOneUITests/ExplorerTests
          # Screenshot matrix per device. The main device must succeed; small/large stay non-blocking as before.
          - shard: screenshots-main
            device: main
            screenshots: true
            tests: -only-testing:PulseOneUITests/ScreenshotTests
          - shard: screenshots-small
            device: small
            screenshots: true
            allow_failure: true
            tests: -only-testing:PulseOneUITests/ScreenshotTests
          - shard: screenshots-large
            device: large
            screenshots: true
            allow_failure: true
            tests: -only-testing:PulseOneUITests/ScreenshotTests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode
        run: |
          if [ -d "/Applications/Xcode_${XCODE_VERSION}.app" ]; then
            sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"
          else
            echo "::error::Xcode ${XCODE_VERSION} not on runner. Available:"; ls -d /Applications/Xcode*.app; exit 1
          fi
          xcodebuild -version; swift --version

      - name: Pick and boot simulator
        id: sims
        run: |
          scripts/pick-simulators.sh >> "$GITHUB_OUTPUT"
          id=$(grep "^${{ matrix.device }}=" "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2)
          name=$(grep "^${{ matrix.device }}_name=" "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2)
          echo "id=$id" >> "$GITHUB_OUTPUT"; echo "name=$name" >> "$GITHUB_OUTPUT"
          # Boot while the app compiles; xcodebuild would otherwise boot it before the first test.
          xcrun simctl boot "$id" || true

      # Five shards downloading the release at once got HTTP 403 from GitHub (run 117), so the binary is cached
      # per version and the download retries.
      - name: Cache XcodeGen ${{ env.XCODEGEN_VERSION }}
        id: xcodegen-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/xcodegen
          key: xcodegen-${{ env.XCODEGEN_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Install XcodeGen ${{ env.XCODEGEN_VERSION }}
        run: |
          if [ ! -x ~/xcodegen/xcodegen/bin/xcodegen ]; then
            curl -fsSL --retry 5 --retry-all-errors --retry-delay 15 -o /tmp/xcodegen.zip \
              "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
            rm -rf ~/xcodegen && unzip -q /tmp/xcodegen.zip -d ~/xcodegen
          fi
          echo "$HOME/xcodegen/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Core package tests (Swift Testing)
        if: matrix.packages
        run: |
          for pkg in apps/$APP/Packages/*/; do swift test --package-path "$pkg"; done

      - name: Generate project
        run: xcodegen generate --spec "apps/$APP/project.yml"

      - name: Build for testing
        id: build
        run: |
          set -o pipefail; mkdir -p build
          xcodebuild build-for-testing -project "apps/$APP/$APP.xcodeproj" -scheme "$APP" \
            -destination "platform=iOS Simulator,id=${{ steps.sims.outputs.id }}" \
            -derivedDataPath build/dd SWIFT_TREAT_WARNINGS_AS_ERRORS=YES 2>&1 | tee build/build.log | grep -E "error:|warning:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "TEST BUILD SUCCEEDED\|BUILD SUCCEEDED" build/build.log

      - name: Run tests
        run: |
          xcrun simctl bootstatus "${{ steps.sims.outputs.id }}" -b || true
          xcodebuild test-without-building -project "apps/$APP/$APP.xcodeproj" -scheme "$APP" \
            -destination "platform=iOS Simulator,id=${{ steps.sims.outputs.id }}" \
            -derivedDataPath build/dd -resultBundlePath "build/${{ matrix.shard }}.xcresult" \
            ${{ matrix.tests }} || { [ "${{ matrix.allow_failure }}" = "true" ] && echo "::warning::${{ matrix.shard }} failed (non-blocking)"; }

      - name: Export screenshots
        if: always() && matrix.screenshots
        run: scripts/export-screenshots.sh "build/${{ matrix.shard }}.xcresult" "shots/${{ steps.sims.outputs.name }}"

      - name: Walkthrough report in the run summary
        if: always() && matrix.shard == 'accessibility'
        run: |
          report=$(find shots -name explore-report.md | head -1)
          if [ -n "$report" ]; then cat "$report" >> "$GITHUB_STEP_SUMMARY"; else echo "Kein Rundgang-Bericht (Test nicht gelaufen)." >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Upload screenshots for the publish job
        if: always() && matrix.screenshots
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shots-${{ github.run_number }}-${{ matrix.shard }}
          path: shots
          retention-days: 1
          if-no-files-found: ignore

      - name: Upload results (7 days)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: results-${{ github.run_number }}-${{ matrix.shard }}
          path: |
            build/*.xcresult
            build/build.log
          retention-days: 7
          if-no-files-found: ignore

  # Collects the three devices' screenshots into one commit on ci-screenshots/<branch> (Linux, no macOS minutes).
  publish-screenshots:
    needs: test
    if: always() && needs.test.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write          # push to ci-screenshots/* only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts

      - name: Download screenshots
        continue-on-error: true   # no screenshots (e.g. build failed) -> push step says "nothing to push"
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: shots-${{ github.run_number }}-*
          path: shots
          merge-multiple: true

      # Claude looks at the walkthrough screenshots (test data only) and lists design and text flaws.
      # Owner approved ~0.15 $ per run (2026-11-22); runs on main (each merge, i.e. before every TestFlight
      # build) and on manual runs, not on every branch push. Report only, never fails the run.
      - name: Claude design review of the walkthrough
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          pip install --quiet anthropic==2.12.0 pillow==13.0.0
          python3 scripts/design-review.py shots shots/iPhone-17-Pro/design-review.md
          cat shots/iPhone-17-Pro/design-review.md >> "$GITHUB_STEP_SUMMARY"

      - name: Push screenshots to ci-screenshots branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/push-screenshots.sh shots "ci-screenshots/${GITHUB_REF_NAME}"
