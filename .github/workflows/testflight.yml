name: TestFlight

# Manual only: archives PULSE ONE, signs it automatically with the App Store Connect API key
# and uploads it to App Store Connect for INTERNAL TestFlight testing. No external testers,
# no App Store submission (both need the owner's explicit approval).
#
# Needs repository secrets: ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (contents of AuthKey_XXXX.p8,
# pasted as plain text or base64).

on:
  workflow_dispatch:
    inputs:
      app:
        description: "App folder under apps/"
        default: "PulseOne"

concurrency:
  group: testflight
  cancel-in-progress: false

permissions:
  contents: read

env:
  APP: ${{ inputs.app || 'PulseOne' }}
  XCODE_VERSION: "26.6"
  XCODEGEN_VERSION: "2.48.0"
  TEAM_ID: "86W9BY22V9"   # Apple Developer team of the owner (not a secret)

jobs:
  archive-upload:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check secrets
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          missing=""
          [ -n "$ASC_KEY_ID" ] || missing="$missing ASC_KEY_ID"
          [ -n "$ASC_ISSUER_ID" ] || missing="$missing ASC_ISSUER_ID"
          [ -n "$ASC_KEY_P8" ] || missing="$missing ASC_KEY_P8"
          if [ -n "$missing" ]; then echo "::error::Missing secrets:$missing (see docs/TESTFLIGHT-EINRICHTEN.md)"; exit 1; fi

      - name: Select Xcode
        run: |
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"
          xcodebuild -version

      - name: Install XcodeGen ${{ env.XCODEGEN_VERSION }}
        run: |
          curl -fsSL -o /tmp/xcodegen.zip "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          unzip -q /tmp/xcodegen.zip -d /tmp/xcodegen
          echo "/tmp/xcodegen/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Write API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set +x
          key="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          if printf '%s' "$ASC_KEY_P8" | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s\n' "$ASC_KEY_P8" > "$key"
          else
            printf '%s' "$ASC_KEY_P8" | base64 --decode > "$key"
          fi
          grep -q "BEGIN PRIVATE KEY" "$key" || { echo "::error::ASC_KEY_P8 is not a valid .p8 key"; exit 1; }
          chmod 600 "$key"
          echo "ASC_KEY_PATH=$key" >> "$GITHUB_ENV"

      - name: Generate project
        run: xcodegen generate --spec "apps/$APP/project.yml"

      - name: Archive (automatic signing with API key)
        # The team has no registered devices, so Xcode cannot create a development profile.
        # Strategy 1 signs the archive with the distribution identity (App Store profile, no devices needed).
        # Strategy 2 signs the archive ad hoc (entitlements stay embedded); the export step re-signs for App Store.
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          archive() {
            rm -rf "build/$APP.xcarchive"
            xcodebuild archive -project "apps/$APP/$APP.xcodeproj" -scheme "$APP" \
              -destination "generic/platform=iOS" -archivePath "build/$APP.xcarchive" \
              -allowProvisioningUpdates \
              -authenticationKeyPath "$ASC_KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
              DEVELOPMENT_TEAM="$TEAM_ID" CURRENT_PROJECT_VERSION="${{ github.run_number }}" "$@" \
              > build-archive.log 2>&1 || true
            grep -E "error:|ARCHIVE (SUCCEEDED|FAILED)" build-archive.log || true
            grep -q "ARCHIVE SUCCEEDED" build-archive.log
          }
          mkdir -p build
          echo "== Strategy 1: automatic signing, distribution identity"
          if archive CODE_SIGN_STYLE=Automatic CODE_SIGN_IDENTITY="Apple Distribution"; then exit 0; fi
          echo "== Strategy 2: ad hoc signed archive, re-signed on export"
          archive CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- AD_HOC_CODE_SIGNING_ALLOWED=YES PROVISIONING_PROFILE_SPECIFIER=""

      - name: Check archive metadata before upload
        # TestFlight run 5 was rejected because the archive said build "1". Stop before uploading
        # unless the archived app carries this run's build number.
        run: |
          plist=$(ls -d "build/$APP.xcarchive/Products/Applications/"*.app)/Info.plist
          build=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$plist")
          version=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$plist")
          bundle=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$plist")
          echo "Archive: $bundle version $version build $build (expected build ${{ github.run_number }})"
          echo "### Archive metadata: $bundle $version ($build)" >> "$GITHUB_STEP_SUMMARY"
          [ "$build" = "${{ github.run_number }}" ] || { echo "::error::CFBundleVersion is $build, expected ${{ github.run_number }}"; exit 1; }
          [ -n "$version" ] || { echo "::error::CFBundleShortVersionString is empty"; exit 1; }

      - name: Export and upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>testFlightInternalTestingOnly</key><true/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "build/$APP.xcarchive" \
            -exportOptionsPlist build/ExportOptions.plist -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "Uploaded build ${{ github.run_number }} of $APP to App Store Connect (internal TestFlight)."

      - name: Remove API key
        if: always()
        run: rm -f "$RUNNER_TEMP"/AuthKey_*.p8

      - name: Upload logs (7 days)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: testflight-${{ github.run_number }}
          path: |
            build-archive.log
            build/export/*.log
          retention-days: 7
          if-no-files-found: ignore
